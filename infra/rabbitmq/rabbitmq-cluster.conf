# Clúster RabbitMQ de dos nodos para SIGA (misma EC2, contenedores distintos).
#
# Ambos nodos leen la misma lista de pares: el primero que arranca se convierte
# en el nodo semilla y el segundo se une a él. El bloqueo de formación evita
# que se creen dos clústeres en paralelo. Verificar con:
#   docker exec rabbitmq1 rabbitmqctl cluster_status
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
