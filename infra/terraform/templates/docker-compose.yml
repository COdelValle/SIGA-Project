name: siga

# Variables comunes a todos los microservicios.
# AZURE_* alimenta los placeholders de core-share/common-properties.yaml.
x-ms-common-env: &ms-common-env
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  AZURE_TENANT_ID: ${AZURE_TENANT_ID}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
  AZURE_APP_ID_URI: ${AZURE_APP_ID_URI}
  # RabbitMQ (mensajeria entre microservicios)
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}

# Healthcheck comun de los microservicios (usa SERVER_PORT de cada servicio)
x-ms-healthcheck: &ms-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

services:
  mariadb:
    image: mariadb:11.4
    container_name: siga-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_usuarios_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - /home/ubuntu/siga-data/mariadb:/var/lib/mysql
      - /home/ubuntu/siga/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: siga-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - /home/ubuntu/siga-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-usuarios-auth:
    image: ${REGISTRY}/siga-usuarios-auth:${IMAGE_TAG}
    container_name: ms-usuarios-auth
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_usuarios_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_API_APP_ID: ${AZURE_API_APP_ID}
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-estudiantes:
    image: ${REGISTRY}/siga-estudiantes:${IMAGE_TAG}
    container_name: ms-estudiantes
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_estudiantes_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-asignaturas:
    image: ${REGISTRY}/siga-asignaturas:${IMAGE_TAG}
    container_name: ms-asignaturas
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_asignaturas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_DOCENTES_URL: http://ms-docentes:8088
      MS_CLASES_URL: http://ms-clases:8090
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8082
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-docentes:
        condition: service_healthy
      ms-clases:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy

  ms-notas:
    image: ${REGISTRY}/siga-notas:${IMAGE_TAG}
    container_name: ms-notas
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_notas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_EVALUACIONES_URL: http://ms-evaluaciones:8091
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-evaluaciones:
        condition: service_healthy

  ms-docentes:
    image: ${REGISTRY}/siga-docentes:${IMAGE_TAG}
    container_name: ms-docentes
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_docentes_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-apoderados:
    image: ${REGISTRY}/siga-apoderados:${IMAGE_TAG}
    container_name: ms-apoderados
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_apoderados_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8082
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy

  ms-clases:
    image: ${REGISTRY}/siga-clases:${IMAGE_TAG}
    container_name: ms-clases
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8090"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_clases_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_DOCENTES_URL: http://ms-docentes:8088
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-docentes:
        condition: service_healthy

  ms-evaluaciones:
    image: ${REGISTRY}/siga-evaluaciones:${IMAGE_TAG}
    container_name: ms-evaluaciones
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8091"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/siga_evaluaciones_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy

  bff-web:
    image: ${REGISTRY}/siga-bff-web:${IMAGE_TAG}
    container_name: bff-web
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8080"
      MS_USUARIOS_URL: http://ms-usuarios-auth:8081
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8082
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
      MS_NOTAS_URL: http://ms-notas:8087
      MS_EVALUACIONES_URL: http://ms-evaluaciones:8091
    depends_on:
      ms-usuarios-auth:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy
      ms-notas:
        condition: service_healthy
      ms-evaluaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${REGISTRY}/siga-frontend:${IMAGE_TAG}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /home/ubuntu/siga/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - bff-web
