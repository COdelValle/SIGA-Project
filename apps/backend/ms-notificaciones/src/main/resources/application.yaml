server:
  port: 8091

spring:
  application:
    name: ms-notificaciones
    description: Consume las colas de notificaciones (evaluaciones, notas y asistencias) y registra los avisos

  config:
    import: "optional:classpath:common-properties.yaml"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    # Ejecuta la llamada en el hilo del request (semáforo) para que el token y
    # el correlation id (ThreadLocals) se propaguen por Feign.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

# Circuit Breaker (Resilience4j) para las llamadas salientes del consumidor
resilience4j:
  circuitbreaker:
    instances:
      ms-asignaturas:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-asignaturas-inscripciones:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-estudiantes:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-apoderados:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-asignaturas:
        timeoutDuration: 5s
      ms-asignaturas-inscripciones:
        timeoutDuration: 5s
      ms-estudiantes:
        timeoutDuration: 5s
      ms-apoderados:
        timeoutDuration: 5s

# URLs de los microservicios que consulta para armar el mensaje
services:
  ms-asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}
  ms-estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8083}
  ms-apoderados:
    url: ${MS_APODERADOS_URL:http://localhost:8084}

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# Configuración de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
