server:
  port: 8091

# Bandeja in-app: retención global y horario de purga.
siga:
  mensajeria:
    notificaciones:
      exchange-notificaciones: ${SIGA_MENSAJERIA_NOTIFICACIONES_EXCHANGE_NOTIFICACIONES:intercambio-notificaciones}
      exchange-dlq: ${SIGA_MENSAJERIA_NOTIFICACIONES_EXCHANGE_DLQ:siga.dlx.direct}
      cola-evaluaciones: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_EVALUACIONES:cola-notificaciones-evaluaciones}
      dlq-evaluaciones: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_EVALUACIONES:cola-notificaciones-evaluaciones.dlq}
      cola-asistencias: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_ASISTENCIAS:cola-notificaciones-asistencias}
      dlq-asistencias: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_ASISTENCIAS:cola-notificaciones-asistencias.dlq}
      cola-notas: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_NOTAS:cola-notificaciones-notas}
      dlq-notas: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_NOTAS:cola-notificaciones-notas.dlq}
      cola-riesgo-inasistencia: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_RIESGO_INASISTENCIA:cola-notificaciones-riesgo-inasistencia}
      dlq-riesgo-inasistencia: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_RIESGO_INASISTENCIA:cola-notificaciones-riesgo-inasistencia.dlq}
      cola-riesgo-rendimiento: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_RIESGO_RENDIMIENTO:cola-notificaciones-riesgo-rendimiento}
      dlq-riesgo-rendimiento: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_RIESGO_RENDIMIENTO:cola-notificaciones-riesgo-rendimiento.dlq}
      cola-cambio-estado-academico: ${SIGA_MENSAJERIA_NOTIFICACIONES_COLA_CAMBIO_ESTADO_ACADEMICO:cola-notificaciones-cambio-estado}
      dlq-cambio-estado-academico: ${SIGA_MENSAJERIA_NOTIFICACIONES_DLQ_CAMBIO_ESTADO_ACADEMICO:cola-notificaciones-cambio-estado.dlq}
      patron-evaluacion: ${SIGA_MENSAJERIA_NOTIFICACIONES_PATRON_EVALUACION:evaluacion.*}
      patron-asistencia: ${SIGA_MENSAJERIA_NOTIFICACIONES_PATRON_ASISTENCIA:asistencia.*}
      patron-nota: ${SIGA_MENSAJERIA_NOTIFICACIONES_PATRON_NOTA:nota.*}
      clave-evaluacion-creada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_EVALUACION_CREADA:evaluacion.creada}
      clave-evaluacion-actualizada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_EVALUACION_ACTUALIZADA:evaluacion.actualizada}
      clave-evaluacion-eliminada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_EVALUACION_ELIMINADA:evaluacion.eliminada}
      clave-asistencia-registrada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_ASISTENCIA_REGISTRADA:asistencia.registrada}
      clave-riesgo-inasistencia: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_RIESGO_INASISTENCIA:riesgo.inasistencia}
      clave-riesgo-rendimiento: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_RIESGO_RENDIMIENTO:riesgo.rendimiento}
      clave-cambio-estado-academico: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_CAMBIO_ESTADO_ACADEMICO:riesgo.estado-academico}
      clave-nota-creada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_NOTA_CREADA:nota.creada}
      clave-nota-actualizada: ${SIGA_MENSAJERIA_NOTIFICACIONES_CLAVE_NOTA_ACTUALIZADA:nota.actualizada}
  notificaciones:
    retencion-dias: 90
    purga:
      cron: "0 30 3 * * *"

spring:
  application:
    name: ms-notificaciones
    description: Consume eventos académicos y mantiene la bandeja in-app de notificaciones

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:localhost}:3306/siga_notificaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:dev_password}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    # Clúster de dos nodos: Spring intenta cada dirección en orden.
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        # Los reintentos de procesamiento viven en ConfirmadorMensajes (en
        # memoria, con ACK/NACK explícitos). El retry del contenedor se
        # desactiva para no interferir con el ACK manual: un error de conversión
        # debe ser fatal y derivar de inmediato a la DLQ.
        retry:
          enabled: false

  config:
    import: "optional:classpath:common-properties.yaml"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    # Ejecuta la llamada en el hilo del request (semáforo) para que el token y
    # el correlation id (ThreadLocals) se propaguen por Feign.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

# Circuit Breaker (Resilience4j) para las llamadas salientes del consumidor
resilience4j:
  circuitbreaker:
    instances:
      ms-asignaturas:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-asignaturas-inscripciones:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-estudiantes:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-apoderados:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-asignaturas:
        timeoutDuration: 5s
      ms-asignaturas-inscripciones:
        timeoutDuration: 5s
      ms-estudiantes:
        timeoutDuration: 5s
      ms-apoderados:
        timeoutDuration: 5s

# URLs de los microservicios que consulta para armar el mensaje
services:
  ms-asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}
  ms-estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8083}
  ms-apoderados:
    url: ${MS_APODERADOS_URL:http://localhost:8084}

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# Configuración de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
