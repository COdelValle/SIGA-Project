server:
  port: 8091

# Bandeja in-app: retención global y horario de purga.
siga:
  notificaciones:
    retencion-dias: 90
    purga:
      cron: "0 30 3 * * *"

spring:
  application:
    name: ms-notificaciones
    description: Consume eventos académicos y mantiene la bandeja in-app de notificaciones

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:localhost}:3306/siga_notificaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:dev_password}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    # Clúster de dos nodos: Spring intenta cada dirección en orden.
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 5s
          multiplier: 2
        default-requeue-rejected: false

  config:
    import: "optional:classpath:common-properties.yaml"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    # Ejecuta la llamada en el hilo del request (semáforo) para que el token y
    # el correlation id (ThreadLocals) se propaguen por Feign.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

# Circuit Breaker (Resilience4j) para las llamadas salientes del consumidor
resilience4j:
  circuitbreaker:
    instances:
      ms-asignaturas:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-asignaturas-inscripciones:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-estudiantes:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-apoderados:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-asignaturas:
        timeoutDuration: 5s
      ms-asignaturas-inscripciones:
        timeoutDuration: 5s
      ms-estudiantes:
        timeoutDuration: 5s
      ms-apoderados:
        timeoutDuration: 5s

# URLs de los microservicios que consulta para armar el mensaje
services:
  ms-asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}
  ms-estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8083}
  ms-apoderados:
    url: ${MS_APODERADOS_URL:http://localhost:8084}

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# Configuración de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
