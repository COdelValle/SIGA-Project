spring:
  application:
    name: bff-web
  threads:
    virtual:
      enabled: true
  config:
    import: "optional:classpath:common-properties.yaml"

# URLs de los microservicios de dominio
microservices:
  estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8082}
  asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}
  notas:
    url: ${MS_NOTAS_URL:http://localhost:8087}

# Documentacion OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger

# Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
