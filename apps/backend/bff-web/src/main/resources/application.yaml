spring:
  application:
    name: bff-web
  threads:
    virtual:
      enabled: true
  # Habilita el uso de los fallbacks declarados en los clientes Feign
  # (un fallo de un microservicio responde 503 en vez de 500).
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  config:
    import: "optional:classpath:common-properties.yaml"

# URLs de los microservicios de dominio
microservices:
  usuarios:
    url: ${MS_USUARIOS_URL:http://localhost:8081}
  estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8082}
  asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}
  notas:
    url: ${MS_NOTAS_URL:http://localhost:8087}
  evaluaciones:
    url: ${MS_EVALUACIONES_URL:http://localhost:8091}

# Documentacion OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger

# Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
