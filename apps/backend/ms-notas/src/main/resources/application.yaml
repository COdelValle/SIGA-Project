server:
  port: 8087

spring:
  application:
    name: ms-notas
    description: Microservicio para la gestiÃ³n de notas
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/siga_notas_db
    username: ${DB_USER:root}
    password: ${DB_PASS:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

  config:
    import: "optional:classpath:common-properties.yaml"

# Circuit Breaker (Resilience4j) para las llamadas salientes de ms-notas
resilience4j:
  circuitbreaker:
    instances:
      ms-estudiantes:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-asignaturas:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-estudiantes:
        timeoutDuration: 5s
      ms-asignaturas:
        timeoutDuration: 5s

# URLs de microservicios con los que se relaciona
services:
  ms-estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8082}
  ms-asignaturas:
    url: ${MS_ASIGNATURAS_URL:http://localhost:8086}

# ConfiguraciÃ³n de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# ConfiguraciÃ³n de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
