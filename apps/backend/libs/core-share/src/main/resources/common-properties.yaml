spring:
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      delivery-mode: persistent
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID}
        credential:
          client-id: ${AZURE_CLIENT_ID}
        app-id-uri: ${AZURE_APP_ID_URI}
        resource-server:
          # Mapea los claims del token de Entra ID a authorities de Spring Security.
          # Sin esto Azure usa APPROLE_ para el claim "roles" y hasRole('ADMIN') nunca coincide.
          claim-to-authority-prefix-map:
            scp: SCOPE_
            roles: ROLE_

# Incluye el correlation id (MDC) en el nivel de cada log.
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
