server:
  port: 8081

spring:
  application:
    name: ms-usuarios-auth
    description: Administra los datos base de la cuenta del usuario y sus roles. Trabaja en conjunto con los claims del JWT entregados por Azure AD.
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/siga_usuarios_db
    username: ${DB_USER:root}
    password: ${DB_PASS:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Carga masiva de invitaciones por CSV (limite alineado con el servicio).
      max-file-size: 2MB
      max-request-size: 2MB
  config:
    import: "optional:classpath:common-properties.yaml"
  # Permite migrar bases que ya tenian tablas creadas por Hibernate (ddl-auto=update)
  # sin historial de Flyway. En bases nuevas aplica V1 normalmente; en existentes
  # crea la linea base y luego aplica las migraciones (V1 es idempotente).
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    # Confirmaciones del broker para el outbox del registro asincrono.
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        # Los reintentos viven en ConfirmadorMensajes (en memoria, con ACK/NACK
        # explícitos). El retry del contenedor se desactiva para que un error de
        # conversión sea fatal y caiga de inmediato a la DLQ.
        retry:
          enabled: false

# Microservicios consultados de forma sincrona por este servicio.
services:
  estudiantes:
    url: ${MS_ESTUDIANTES_URL:http://localhost:8083}

# Topología RabbitMQ del registro asíncrono (exchange, colas y DLQ compartidas).
# Solo los servicios que participan del flujo la declaran.
siga:
  mensajeria:
    registro:
      topology-enabled: true
  # Registro asincrono de usuarios (usuario + perfil de rol, con aprovisionamiento
  # en Entra ID). Deshabilitado por defecto: activar solo con Graph configurado.
  registro-async:
    enabled: ${REGISTRO_ASYNC_ENABLED:false}
    # Reservado para el futuro servicio de notificaciones (opcion 3): emite un
    # evento user.credentials.notify cuando la cuenta queda creada.
    notify-credentials-enabled: ${REGISTRO_NOTIFY_CREDENTIALS_ENABLED:false}
    # Clave AES-256 en Base64 (32 bytes) para cifrar la clave temporal en reposo.
    # Obligatoria cuando enabled=true.
    credential-key: ${REGISTRO_CRED_KEY:}
    credential-ttl-hours: 48
    # Dominio del correo institucional generado a partir del nombre.
    email-domain: ${REGISTRO_EMAIL_DOMAIN:platformsiga.onmicrosoft.com}
    outbox-poll-ms: 2000
    outbox-max-attempts: 10
    outbox-confirm-timeout-seconds: 5

# Integración con Microsoft Graph (client credentials).
# Si AZURE_CLIENT_SECRET está vacío, la integración queda deshabilitada y el CRUD
# sigue funcionando, pero no se puede resolver el oid ni sincronizar roles.
azure:
  graph:
    tenant-id: ${AZURE_TENANT_ID:}
    client-id: ${AZURE_CLIENT_ID:}
    client-secret: ${AZURE_CLIENT_SECRET:}
    api-app-id: ${AZURE_API_APP_ID:}

# Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
