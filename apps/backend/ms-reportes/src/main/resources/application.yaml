server:
  port: 8092

spring:
  application:
    name: ms-reportes
    description: Proyecciones y análisis académico consumidos desde Kafka
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:localhost}:3306/siga_reportes_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:dev_password}}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: cl.siga.coreshare.dto.kafka
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      missing-topics-fatal: false
  config:
    import: "optional:classpath:common-properties.yaml"

siga:
  notificaciones:
    outbox:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger

scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
