server:
  port: 8086

spring:
  application:
    name: ms-asignaturas
    description: Microservicio para la gestiÃ³n de asignaturas
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/siga_asignaturas_db
    username: ${DB_USER:root}
    password: ${DB_PASS:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Flyway administra el esquema. baseline-on-migrate permite convivir con bases
  # creadas previamente por Hibernate (ddl-auto=update) sin historial de Flyway.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  config:
    import: "optional:classpath:common-properties.yaml"
  
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      ms-docentes:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ms-clases:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-docentes:
        timeoutDuration: 5s
      ms-clases:
        timeoutDuration: 5s

services:
  ms-docentes:
    url: ${MS_DOCENTES_URL:http://localhost:8088}
  ms-clases:
    url: ${MS_CLASES_URL:http://localhost:8090}

# ConfiguraciÃ³n de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# ConfiguraciÃ³n de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar          # Ruta donde se cargarÃ¡ Scalar (ej: http://localhost:8081/docs/scalar)
  url: /v3/api-docs           # EspecificaciÃ³n JSON a consumir
  theme: purple               # Temas opcionales: default, moon, purple, solarized, etc.
  darkMode: true