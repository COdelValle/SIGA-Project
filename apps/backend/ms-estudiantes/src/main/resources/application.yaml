server:
  port: 8082

spring:
  application:
    name: ms-estudiantes
    description: Gestiona el CRUD de los alumnos, sus perfiles, alergias y matrícula
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/siga_estudiantes_db
    username: ${DB_USER:root}
    password: ${DB_PASS:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: "optional:classpath:common-properties.yaml"

# Configuración de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger

# Configuración de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
