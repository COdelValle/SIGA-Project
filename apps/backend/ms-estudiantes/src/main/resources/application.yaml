server:
  port: 8083

spring:
  application:
    name: ms-estudiantes
    description: Gestiona el CRUD de los alumnos, sus perfiles, alergias y matrÃ­cula
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/siga_estudiantes_db
    username: ${DB_USER:root}
    password: ${DB_PASS:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Flyway administra el esquema. baseline-on-migrate permite convivir con bases
  # creadas previamente por Hibernate (ddl-auto=update) sin historial de Flyway.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  # RabbitMQ: consumidor del registro asincrono (ACK/NACK manuales con DLQ).
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        # Los reintentos viven en ConfirmadorMensajes (en memoria); el retry del
        # contenedor se desactiva para que un error de conversión derive a la DLQ.
        retry:
          enabled: false
  config:
    import: "optional:classpath:common-properties.yaml"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    # Ejecuta la llamada en el hilo del request (semáforo) para que el token y
    # el correlation id (ThreadLocals) se propaguen por Feign.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

resilience4j:
  circuitbreaker:
    instances:
      ms-apoderados:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      ms-apoderados:
        timeoutDuration: 5s

# Topología RabbitMQ del registro asíncrono (exchange, colas y DLQ compartidas).
siga:
  mensajeria:
    registro:
      topology-enabled: true
      exchange: ${SIGA_MENSAJERIA_REGISTRO_EXCHANGE:user.topic.exchange}
      azure-queue: ${SIGA_MENSAJERIA_REGISTRO_AZURE_QUEUE:user.azure.sync.queue}
      estudiantes-queue: ${SIGA_MENSAJERIA_REGISTRO_ESTUDIANTES_QUEUE:ms.estudiantes.queue}
      docentes-queue: ${SIGA_MENSAJERIA_REGISTRO_DOCENTES_QUEUE:ms.docentes.queue}
      apoderados-queue: ${SIGA_MENSAJERIA_REGISTRO_APODERADOS_QUEUE:ms.apoderados.queue}
      status-queue: ${SIGA_MENSAJERIA_REGISTRO_STATUS_QUEUE:user.registration.status.queue}
      credentials-queue: ${SIGA_MENSAJERIA_REGISTRO_CREDENTIALS_QUEUE:user.credentials.notify.queue}
      azure-dlq: ${SIGA_MENSAJERIA_REGISTRO_AZURE_DLQ:user.azure.sync.dlq}
      estudiantes-dlq: ${SIGA_MENSAJERIA_REGISTRO_ESTUDIANTES_DLQ:ms.estudiantes.dlq}
      docentes-dlq: ${SIGA_MENSAJERIA_REGISTRO_DOCENTES_DLQ:ms.docentes.dlq}
      apoderados-dlq: ${SIGA_MENSAJERIA_REGISTRO_APODERADOS_DLQ:ms.apoderados.dlq}
      status-dlq: ${SIGA_MENSAJERIA_REGISTRO_STATUS_DLQ:user.registration.status.dlq}
      credentials-dlq: ${SIGA_MENSAJERIA_REGISTRO_CREDENTIALS_DLQ:user.credentials.notify.dlq}
      rk-azure-sync: ${SIGA_MENSAJERIA_REGISTRO_RK_AZURE_SYNC:user.registration.azure}
      rk-register-estudiante: ${SIGA_MENSAJERIA_REGISTRO_RK_REGISTER_ESTUDIANTE:user.register.estudiante}
      rk-register-docente: ${SIGA_MENSAJERIA_REGISTRO_RK_REGISTER_DOCENTE:user.register.docente}
      rk-register-apoderado: ${SIGA_MENSAJERIA_REGISTRO_RK_REGISTER_APODERADO:user.register.apoderado}
      rk-status: ${SIGA_MENSAJERIA_REGISTRO_RK_STATUS:user.registration.status}
      rk-credentials-notify: ${SIGA_MENSAJERIA_REGISTRO_RK_CREDENTIALS_NOTIFY:user.credentials.notify}
      header-correlation-id: ${SIGA_MENSAJERIA_REGISTRO_HEADER_CORRELATION_ID:X-Correlation-Id}

# URL del servicio que valida el vinculo apoderado-estudiante.
services:
  ms-apoderados:
    url: ${MS_APODERADOS_URL:http://localhost:8084}

# ConfiguraciÃ³n de OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs/swagger
# ConfiguraciÃ³n de Scalar UI
scalar:
  enabled: true
  path: /docs/scalar
  url: /v3/api-docs
  theme: purple
  darkMode: true
