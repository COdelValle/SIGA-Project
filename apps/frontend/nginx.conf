server {
    listen 80;
    server_name _;

    # DNS embebido de Docker: nginx cachea la IP de un upstream resuelto al
    # arrancar, asi que si el contenedor del BFF se recrea (otra IP) las
    # peticiones fallan con 502. Con resolver + variable se re-resuelve solo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA para las rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al BFF. Es necesario en Docker local (config.json -> bffBaseUrl = /api).
    # En AWS esta ruta nunca se ejecuta: el API Gateway intercepta /api/{proxy+}
    # y lo envia directo al BFF; nginx solo sirve el SPA ($default).
    location /api/ {
        set $bff_upstream http://bff-web:8080;
        proxy_pass $bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets con hash
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Headers de seguridad basicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
