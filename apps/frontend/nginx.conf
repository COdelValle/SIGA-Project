server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA para las rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nota: el API ya no se proxya desde Nginx. El navegador llama directamente
    # al API Gateway (config.json -> bffBaseUrl). Nginx solo sirve el SPA.

    # Cache de assets con hash
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Headers de seguridad basicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
