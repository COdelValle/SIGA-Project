<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>SIGA - Portal Academico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <div
    id="boot-loader"
    style="
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #f8fafc;
      color: #475569;
      font-family: system-ui, -apple-system, sans-serif;
    "
  >
    <span
      style="
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: 4px solid #e2e8f0;
        border-top-color: #2563eb;
        animation: boot-spin 0.8s linear infinite;
      "
    ></span>
    <p style="margin: 0; font-size: 0.875rem; font-weight: 500">Iniciando sesión…</p>
  </div>
  <style>
    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</body>
</html>
