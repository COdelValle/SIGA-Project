name: siga-project

networks:
  siga-network:
    driver: bridge

volumes:
  mariadb_usuarios_data:
  mariadb_estudiantes_data:
  mariadb_asignaturas_data:
  mariadb_notas_data:

# Configuración común a las instancias MariaDB (database-per-service)
x-mariadb-common: &mariadb-common
  image: mariadb:11.4
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 10s
    timeout: 5s
    retries: 10
  networks:
    - siga-network

# Variables comunes a todos los microservicios
x-ms-common-env: &ms-common-env
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_ENABLED: "true"
  SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_PROFILE_TENANT_ID: ${AZURE_TENANT_ID}
  SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_CREDENTIAL_CLIENT_ID: ${AZURE_CLIENT_ID}
  SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_APP_ID_URI: ${AZURE_APP_ID_URI}

services:
  # ---------------------------------------------------------------
  # Bases de datos (una por microservicio)
  # ---------------------------------------------------------------
  mariadb-usuarios:
    <<: *mariadb-common
    container_name: mariadb-usuarios
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_usuarios_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql

  mariadb-estudiantes:
    <<: *mariadb-common
    container_name: mariadb-estudiantes
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_estudiantes_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_estudiantes_data:/var/lib/mysql

  mariadb-asignaturas:
    <<: *mariadb-common
    container_name: mariadb-asignaturas
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_asignaturas_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_asignaturas_data:/var/lib/mysql

  mariadb-notas:
    <<: *mariadb-common
    container_name: mariadb-notas
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_notas_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_notas_data:/var/lib/mysql

  # ---------------------------------------------------------------
  # Microservicios
  # ---------------------------------------------------------------
  ms-usuarios-auth:
    build:
      context: ./apps/backend
      dockerfile: ms-usuarios-auth/Dockerfile
    container_name: ms-usuarios-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-usuarios:3306/siga_usuarios_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      # Microsoft Graph (pre-registro por email y sincronización de roles)
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_API_APP_ID: ${AZURE_API_APP_ID}
    depends_on:
      mariadb-usuarios:
        condition: service_healthy
    networks:
      - siga-network

  ms-estudiantes:
    build:
      context: ./apps/backend
      dockerfile: ms-estudiantes/Dockerfile
    container_name: ms-estudiantes
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-estudiantes:3306/siga_estudiantes_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb-estudiantes:
        condition: service_healthy
    networks:
      - siga-network

  ms-asignaturas:
    build:
      context: ./apps/backend
      dockerfile: ms-asignaturas/Dockerfile
    container_name: ms-asignaturas
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-asignaturas:3306/siga_asignaturas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb-asignaturas:
        condition: service_healthy
    networks:
      - siga-network

  ms-notas:
    build:
      context: ./apps/backend
      dockerfile: ms-notas/Dockerfile
    container_name: ms-notas
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-notas:3306/siga_notas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb-notas:
        condition: service_healthy
    networks:
      - siga-network

  # ---------------------------------------------------------------
  # BFF Web y Frontend
  # ---------------------------------------------------------------
  bff-web:
    build:
      context: ./apps/backend
      dockerfile: bff-web/Dockerfile
    container_name: bff-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8080"
      MS_USUARIOS_URL: http://ms-usuarios-auth:8081
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8082
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
      MS_NOTAS_URL: http://ms-notas:8087
    depends_on:
      - ms-usuarios-auth
      - ms-estudiantes
      - ms-asignaturas
      - ms-notas
    networks:
      - siga-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - bff-web
    networks:
      - siga-network
