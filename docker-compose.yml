name: siga-project

networks:
  siga-network:
    driver: bridge

volumes:
  mariadb_usuarios_data:
  mariadb_estudiantes_data:
  mariadb_asignaturas_data:
  mariadb_notas_data:
  mariadb_docentes_data:
  mariadb_apoderados_data:
  mariadb_clases_data:
  mariadb_evaluaciones_data:
  mariadb_asistencias_data:
  mariadb_notificaciones_data:
  rabbitmq1_data:
  rabbitmq2_data:
  #Kafka
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  kafka_admin_data:

# Configuración común a las instancias MariaDB (database-per-service)
x-mariadb-common: &mariadb-common
  image: mariadb:11.4
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 10s
    timeout: 5s
    retries: 10
  networks:
    - siga-network

# Variables comunes a todos los microservicios
x-ms-common-env: &ms-common-env
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  # Zona horaria institucional: los LocalDateTime.now() de los servicios
  # (notificaciones, outbox, auditoria) quedan en hora de Chile.
  TZ: America/Santiago
  AZURE_TENANT_ID: ${AZURE_TENANT_ID}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
  AZURE_APP_ID_URI: ${AZURE_APP_ID_URI}
  # Opcionales; por defecto core-share deriva issuer/JWKS/audiences del tenant.
  AZURE_JWT_ISSUER: ${AZURE_JWT_ISSUER:-}
  AZURE_JWKS_URI: ${AZURE_JWKS_URI:-}
  AZURE_JWT_AUDIENCES: ${AZURE_JWT_AUDIENCES:-}
  # RabbitMQ (mensajeria entre microservicios): clúster de dos nodos en la
  # misma EC2. Spring intenta cada dirección en orden.
  SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
  SPRING_RABBITMQ_PUBLISHER_CONFIRM_TYPE: correlated
  SPRING_RABBITMQ_PUBLISHER_RETURNS: "true"
  SPRING_RABBITMQ_TEMPLATE_MANDATORY: "true"
  # ACK/NACK manuales: los reintentos viven en ConfirmadorMensajes (en memoria).
  # El retry del contenedor se desactiva para que un error de conversión sea
  # fatal y derive de inmediato a la DLQ, en vez de quedar retenido sin confirmar.
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED: "false"
  # Resiliencia: ejecuta Feign en el hilo del request (semáforo) para que el
  # token y el correlation id se propaguen; breaker y fallbacks siguen activos.
  SPRING_CLOUD_CIRCUITBREAKER_RESILIENCE4J_DISABLE_THREAD_POOL: "true"

# Healthcheck comun de los microservicios (usa SERVER_PORT de cada servicio).
# Los JVM tardan ~100 s en arrancar y mas aun en una recreacion masiva: un
# start_period amplio evita que docker los marque "unhealthy" a mitad de boot.
x-ms-healthcheck: &ms-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 240s

services:
  # ---------------------------------------------------------------
  # Bases de datos (una por microservicio)
  # ---------------------------------------------------------------
  mariadb-usuarios:
    <<: *mariadb-common
    container_name: mariadb-usuarios
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_usuarios_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql

  mariadb-estudiantes:
    <<: *mariadb-common
    container_name: mariadb-estudiantes
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_estudiantes_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_estudiantes_data:/var/lib/mysql

  mariadb-asignaturas:
    <<: *mariadb-common
    container_name: mariadb-asignaturas
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_asignaturas_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_asignaturas_data:/var/lib/mysql

  mariadb-notas:
    <<: *mariadb-common
    container_name: mariadb-notas
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_notas_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_notas_data:/var/lib/mysql

  mariadb-docentes:
    <<: *mariadb-common
    container_name: mariadb-docentes
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_docentes_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_docentes_data:/var/lib/mysql

  mariadb-apoderados:
    <<: *mariadb-common
    container_name: mariadb-apoderados
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_apoderados_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_apoderados_data:/var/lib/mysql

  mariadb-clases:
    <<: *mariadb-common
    container_name: mariadb-clases
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_clases_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_clases_data:/var/lib/mysql

  mariadb-evaluaciones:
    <<: *mariadb-common
    container_name: mariadb-evaluaciones
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_evaluaciones_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_evaluaciones_data:/var/lib/mysql

  mariadb-asistencias:
    <<: *mariadb-common
    container_name: mariadb-asistencias
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_asistencias_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_asistencias_data:/var/lib/mysql

  mariadb-notificaciones:
    <<: *mariadb-common
    container_name: mariadb-notificaciones
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: siga_notificaciones_db
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_notificaciones_data:/var/lib/mysql

  # ---------------------------------------------------------------
  # Mensajeria: clúster RabbitMQ de dos nodos sobre la misma EC2.
  # Comparten el Erlang cookie y se descubren por el archivo de configuración;
  # el Management UI queda en rabbitmq1 (http://localhost:15672).
  # ---------------------------------------------------------------
  rabbitmq1:
    image: rabbitmq:4.3.6-management-alpine
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-siga-dev-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/10-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siga-network

  rabbitmq2:
    image: rabbitmq:4.3.6-management-alpine
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-siga-dev-cookie}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/10-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siga-network
  mariadb-kafka:
    image: mariadb:11.4
    container_name: mariadb-kafka
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-RAHHH234}
      MARIADB_DATABASE: kafka_database
      MARIADB_USER: ${KFK_USER:-kafka233}
      MARIADB_PASSWORD: ${KFK_PASS:-fakta2}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siga-network
    volumes:
      - kafka_admin_data:/var/lib/mysql

  # ---------------------------------------------------------------
  # Microservicios
  # ---------------------------------------------------------------
  ms-usuarios-auth:
    build:
      context: ./apps/backend
      dockerfile: ms-usuarios-auth/Dockerfile
    container_name: ms-usuarios-auth
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-usuarios:3306/siga_usuarios_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      # Microsoft Graph (pre-registro por email y sincronización de roles)
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_API_APP_ID: ${AZURE_API_APP_ID}
      # Registro asincrono de usuarios (usuario + perfil de rol)
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
      REGISTRO_ASYNC_ENABLED: ${REGISTRO_ASYNC_ENABLED:-false}
      REGISTRO_CRED_KEY: ${REGISTRO_CRED_KEY:-}
      REGISTRO_NOTIFY_CREDENTIALS_ENABLED: ${REGISTRO_NOTIFY_CREDENTIALS_ENABLED:-false}
      REGISTRO_EMAIL_DOMAIN: ${REGISTRO_EMAIL_DOMAIN:-platformsiga.onmicrosoft.com}
    depends_on:
      mariadb-usuarios:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
    networks:
      - siga-network

  ms-estudiantes:
    build:
      context: ./apps/backend
      dockerfile: ms-estudiantes/Dockerfile
    container_name: ms-estudiantes
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-estudiantes:3306/siga_estudiantes_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_APODERADOS_URL: http://ms-apoderados:8084
    depends_on:
      mariadb-estudiantes:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    networks:
      - siga-network

  ms-asignaturas:
    build:
      context: ./apps/backend
      dockerfile: ms-asignaturas/Dockerfile
    container_name: ms-asignaturas
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-asignaturas:3306/siga_asignaturas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_DOCENTES_URL: http://ms-docentes:8085
      MS_CLASES_URL: http://ms-clases:8087
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
    depends_on:
      mariadb-asignaturas:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-docentes:
        condition: service_healthy
      ms-clases:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
    networks:
      - siga-network

  ms-notas:
    build:
      context: ./apps/backend
      dockerfile: ms-notas/Dockerfile
    container_name: ms-notas
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-notas:3306/siga_notas_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
      MS_EVALUACIONES_URL: http://ms-evaluaciones:8088
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
    depends_on:
      mariadb-notas:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
      ms-evaluaciones:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy
    networks:
      - siga-network

  ms-docentes:
    build:
      context: ./apps/backend
      dockerfile: ms-docentes/Dockerfile
    container_name: ms-docentes
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-docentes:3306/siga_docentes_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    depends_on:
      mariadb-docentes:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
    networks:
      - siga-network

  ms-apoderados:
    build:
      context: ./apps/backend
      dockerfile: ms-apoderados/Dockerfile
    container_name: ms-apoderados
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-apoderados:3306/siga_apoderados_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
    depends_on:
      mariadb-apoderados:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
    networks:
      - siga-network

  ms-clases:
    build:
      context: ./apps/backend
      dockerfile: ms-clases/Dockerfile
    container_name: ms-clases
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-clases:3306/siga_clases_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_DOCENTES_URL: http://ms-docentes:8085
    depends_on:
      mariadb-clases:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-docentes:
        condition: service_healthy
    networks:
      - siga-network

  ms-evaluaciones:
    build:
      context: ./apps/backend
      dockerfile: ms-evaluaciones/Dockerfile
    container_name: ms-evaluaciones
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-evaluaciones:3306/siga_evaluaciones_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
    depends_on:
      mariadb-evaluaciones:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy
    networks:
      - siga-network

  ms-asistencias:
    build:
      context: ./apps/backend
      dockerfile: ms-asistencias/Dockerfile
    container_name: ms-asistencias
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8090"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-asistencias:3306/siga_asistencias_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
    depends_on:
      mariadb-asistencias:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy
    networks:
      - siga-network

  # ---------------------------------------------------------------
  # Consumidor de colas de notificaciones (evaluaciones, notas, asistencias)
  # ---------------------------------------------------------------
  ms-notificaciones:
    build:
      context: ./apps/backend
      dockerfile: ms-notificaciones/Dockerfile
    container_name: ms-notificaciones
    healthcheck: *ms-healthcheck
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      <<: *ms-common-env
      SERVER_PORT: "8091"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-notificaciones:3306/siga_notificaciones_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      MS_ASIGNATURAS_URL: http://ms-asignaturas:8086
      MS_ESTUDIANTES_URL: http://ms-estudiantes:8083
      MS_APODERADOS_URL: http://ms-apoderados:8084
    depends_on:
      mariadb-notificaciones:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      ms-asignaturas:
        condition: service_healthy
      ms-estudiantes:
        condition: service_healthy
      ms-apoderados:
        condition: service_healthy
    networks:
      - siga-network

  # ---------------------------------------------------------------
  # Administrador  Kafka
  # ---------------------------------------------------------------

  # ZOOKEEPER'S
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-1
    container_name: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - siga-network
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-2
    container_name: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - siga-network
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper-3
    container_name: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - siga-network
  # KAFKA BROKERS
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka-1
    container_name: kafka-1
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
