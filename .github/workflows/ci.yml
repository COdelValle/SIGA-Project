name: CI

on:
  push:
    branches: [dev, main, deploy]
  pull_request:
    branches: [dev, deploy, main]

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests unitarios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Permisos de mvnw
        run: find . -name mvnw -exec chmod +x {} \;

      # Compila todos los modulos y corre los tests unitarios. Se excluyen los
      # contextLoads (*ApplicationTests) porque requieren base de datos y Azure AD.
      # typescript.generator.skip evita que bff-web escriba fuera del workspace.
      - name: Build + tests
        run: >-
          mvn -B -ntp package
          -Dtest='!*ApplicationTests'
          -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtypescript.generator.skip=true

      - name: Guardar reportes JUnit del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-${{ github.sha }}
          path: apps/backend/**/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar resultados Allure del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-allure-${{ github.sha }}
          path: apps/backend/**/target/allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar cobertura del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: apps/backend/**/target/site/jacoco
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      npm_config_legacy_peer_deps: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests unitarios
        run: npm test -- --watch=false --coverage

      - name: Build de produccion
        run: npm run build -- --configuration production

      - name: Guardar reporte JUnit del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit-${{ github.sha }}
          path: apps/frontend/dist/test-results/frontend-junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Preparar artefacto Allure del frontend
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p allure-artifact/allure-results
          cp -R allure-results/. allure-artifact/allure-results/

      - name: Guardar resultados Allure del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-allure-${{ github.sha }}
          path: apps/frontend/allure-artifact
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: apps/frontend/coverage
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: E2E (Playwright + autenticacion simulada)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    env:
      npm_config_legacy_peer_deps: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E
        run: npm run e2e

      - name: Preparar artefacto Allure de E2E
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p allure-artifact/allure-results-e2e
          cp -R allure-results-e2e/. allure-artifact/allure-results-e2e/

      - name: Guardar resultados Allure de E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-allure-${{ github.sha }}
          path: apps/frontend/allure-artifact
          if-no-files-found: warn
          retention-days: 30

  infra:
    name: Infra (Terraform + Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: >-
          node tools/ci/allure-command.mjs --name "terraform validate"
          --dir tools/infra/allure-results --
          terraform -chdir=infra/terraform validate

      - name: Terraform fmt
        run: >-
          node tools/ci/allure-command.mjs --name "terraform fmt -check"
          --dir tools/infra/allure-results --
          terraform -chdir=infra/terraform fmt -check

      - name: Docker Compose config
        run: >-
          node tools/ci/allure-command.mjs --name "docker compose config"
          --dir tools/infra/allure-results --
          docker compose --env-file .env.example config -q

      - name: Preparar artefacto Allure de infraestructura
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p allure-artifact/allure-results
          cp -R tools/infra/allure-results/. allure-artifact/allure-results/

      - name: Guardar resultados Allure de infraestructura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-allure-${{ github.sha }}
          path: allure-artifact
          if-no-files-found: warn
          retention-days: 30

  allure-report:
    name: Reporte Allure centralizado
    needs: [backend, frontend, e2e, infra]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      ALLURE_RUN: ${{ github.run_number }}
      ALLURE_COMMIT: ${{ github.sha }}
      ALLURE_ENV: ci
      ALLURE_HISTORY_PATH: .allure-history/${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias de reporte
        run: npm ci --ignore-scripts

      - name: Descargar resultados Allure
        uses: actions/download-artifact@v4
        with:
          pattern: '*allure-${{ github.sha }}'
          path: allure-results-download

      - name: Descargar cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: '*coverage-${{ github.sha }}'
          path: coverage-download

      - name: Restaurar historial de Allure
        uses: actions/cache@v4
        with:
          path: .allure-history
          key: allure-history-${{ env.ALLURE_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ env.ALLURE_BRANCH }}-

      - name: Enriquecer etiquetas Allure
        run: node tools/allure/enrich-results.mjs allure-results-download

      - name: Generar resultados de cobertura
        run: >-
          node tools/coverage/collect-coverage.mjs
          --root coverage-download --output tools/coverage

      - name: Informar cobertura vs objetivo
        run: node tools/coverage/check-coverage.mjs

      - name: Verificar taxonomia Allure
        run: >-
          node tools/allure/verify-taxonomy.mjs
          allure-results-download tools/coverage/allure-results

      - name: Verificar que esten todas las suites
        run: node tools/allure/verify-results.mjs allure-results-download

      - name: Sanitizar resultados
        run: |
          mapfile -t RESULT_DIRS < <(find allure-results-download -type d \( -name allure-results -o -name allure-results-e2e \); echo tools/coverage/allure-results)
          node tools/allure/sanitize-results.mjs "${RESULT_DIRS[@]}"

      - name: Generar reporte Allure
        run: |
          mapfile -t RESULT_DIRS < <(find allure-results-download -type d \( -name allure-results -o -name allure-results-e2e \); echo tools/coverage/allure-results)
          npx allure generate "${RESULT_DIRS[@]}" --config allurerc.mjs --clean

      - name: Guardar reporte Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.sha }}
          path: allure-report
          if-no-files-found: warn
          retention-days: 30

      - name: Comentar resumen Allure en el PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sections: |
            new
            flaky
            retry

      - name: Preparar publicacion de Pages
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main' || github.ref_name == 'deploy')
        run: |
          rm -rf pages-publish
          mkdir -p pages-publish/coverage/backend pages-publish/coverage/frontend
          cp -R allure-report "pages-publish/${{ github.ref_name }}"
          cp tools/allure/site/index.html pages-publish/index.html
          touch pages-publish/.nojekyll
          find coverage-download -type d -path '*/target/site/jacoco' | while read -r dir; do
            module=$(basename "$(dirname "$(dirname "$(dirname "$dir")")")")
            cp -R "$dir" "pages-publish/coverage/backend/$module"
          done
          find coverage-download -type d -name lcov-report | while read -r dir; do
            cp -R "$dir"/. pages-publish/coverage/frontend/
          done

      - name: Publicar reporte e indice en GitHub Pages
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main' || github.ref_name == 'deploy')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./pages-publish
          destination_dir: .
          keep_files: true
          enable_jekyll: false
