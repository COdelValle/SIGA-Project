name: CD

# Despliegue manual y controlado: las credenciales del AWS Academy Learner Lab
# son temporales (~4 h), por lo que se refrescan los secretos AWS_* y se dispara
# este workflow justo antes de desplegar.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, push a ECR y deploy en EC2
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TAG_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir URLs de repositorios ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> $GITHUB_ENV
          echo "MS_USER_ECR=${REGISTRY}/siga-usuarios-auth" >> $GITHUB_ENV
          echo "MS_EST_ECR=${REGISTRY}/siga-estudiantes" >> $GITHUB_ENV
          echo "MS_ASIGN_ECR=${REGISTRY}/siga-asignaturas" >> $GITHUB_ENV
          echo "MS_GRADE_ECR=${REGISTRY}/siga-notas" >> $GITHUB_ENV
          echo "BFF_WEB_ECR=${REGISTRY}/siga-bff-web" >> $GITHUB_ENV
          echo "FRONTEND_ECR=${REGISTRY}/siga-frontend" >> $GITHUB_ENV

      # Descubre el destino en AWS por tag/nombre: evita mantener EC2_HOST y
      # API_GW_INVOKE_URL como secrets (cambian al recrear la infraestructura).
      - name: Resolver destino (EC2 + API Gateway)
        run: |
          EC2_HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=SIGA-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          API_GW_INVOKE_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='SIGA-http-api'].ApiEndpoint | [0]" --output text)

          if [ -z "$EC2_HOST" ] || [ "$EC2_HOST" = "None" ]; then
            echo "No se encontro la instancia SIGA-app en ejecucion. Corre 'terraform apply' primero." >&2
            exit 1
          fi
          if [ -z "$API_GW_INVOKE_URL" ] || [ "$API_GW_INVOKE_URL" = "None" ]; then
            echo "No se encontro el API Gateway SIGA-http-api. Corre 'terraform apply' primero." >&2
            exit 1
          fi

          echo "EC2_HOST=${EC2_HOST}" >> $GITHUB_ENV
          echo "API_GW_INVOKE_URL=${API_GW_INVOKE_URL}" >> $GITHUB_ENV
          echo "Destino resuelto -> EC2=${EC2_HOST} API=${API_GW_INVOKE_URL}"

      # El contexto de build es apps/backend (el pom padre y los modulos son
      # necesarios); por eso se usa -f con el Dockerfile de cada servicio.
      - name: Build & Push - ms-usuarios-auth
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_USER_ECR:${TAG_VERSION} -t $MS_USER_ECR:latest \
            -f ./apps/backend/ms-usuarios-auth/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-estudiantes
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_EST_ECR:${TAG_VERSION} -t $MS_EST_ECR:latest \
            -f ./apps/backend/ms-estudiantes/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-asignaturas
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_ASIGN_ECR:${TAG_VERSION} -t $MS_ASIGN_ECR:latest \
            -f ./apps/backend/ms-asignaturas/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-notas
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_GRADE_ECR:${TAG_VERSION} -t $MS_GRADE_ECR:latest \
            -f ./apps/backend/ms-notas/Dockerfile ./apps/backend --push

      - name: Build & Push - bff-web
        run: |
          docker buildx build --platform linux/amd64 \
            -t $BFF_WEB_ECR:${TAG_VERSION} -t $BFF_WEB_ECR:latest \
            -f ./apps/backend/bff-web/Dockerfile ./apps/backend --push

      - name: Build & Push - frontend
        run: |
          docker buildx build --platform linux/amd64 \
            -t $FRONTEND_ECR:${TAG_VERSION} -t $FRONTEND_ECR:latest \
            ./apps/frontend --push

      - name: Deploy en la EC2 (stack completo)
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ env.TAG_VERSION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_APP_ID_URI: ${{ secrets.AZURE_APP_ID_URI }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_APP_ID: ${{ secrets.AZURE_API_APP_ID }}
          API_GW_INVOKE_URL: ${{ env.API_GW_INVOKE_URL }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG,AWS_REGION,DB_USER,DB_PASS,MARIADB_ROOT_PASSWORD,AZURE_TENANT_ID,AZURE_CLIENT_ID,AZURE_APP_ID_URI,AZURE_CLIENT_SECRET,AZURE_API_APP_ID,API_GW_INVOKE_URL
          script: |
            set -e
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
            cd /home/ubuntu/siga

            cat > .env <<EOF
            REGISTRY=$REGISTRY
            IMAGE_TAG=$IMAGE_TAG
            DB_USER=$DB_USER
            DB_PASS=$DB_PASS
            MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD
            AZURE_TENANT_ID=$AZURE_TENANT_ID
            AZURE_CLIENT_ID=$AZURE_CLIENT_ID
            AZURE_APP_ID_URI=$AZURE_APP_ID_URI
            AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET
            AZURE_API_APP_ID=$AZURE_API_APP_ID
            EOF

            cat > config.json <<EOF
            {
              "bffBaseUrl": "$API_GW_INVOKE_URL/api",
              "msal": {
                "clientId": "afad9bb4-4804-4b86-965d-34b67774f629",
                "authority": "https://login.microsoftonline.com/c3cfc64e-def3-450f-aee6-07ff80bd6831",
                "redirectUri": "/auth",
                "postLogoutRedirectUri": "/sin-acceso",
                "scopes": ["api://afad9bb4-4804-4b86-965d-34b67774f629/Acceso.Base"]
              }
            }
            EOF

            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
