name: CD

# Despliegue manual y controlado: las credenciales del AWS Academy Learner Lab
# son temporales (~4 h), por lo que se refrescan los secretos AWS_* y se dispara
# este workflow justo antes de desplegar.
on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, push a ECR y deploy en EC2
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TAG_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir URLs de repositorios ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> $GITHUB_ENV
          echo "MS_USER_ECR=${REGISTRY}/siga-usuarios-auth" >> $GITHUB_ENV
          echo "MS_EST_ECR=${REGISTRY}/siga-estudiantes" >> $GITHUB_ENV
          echo "MS_ASIGN_ECR=${REGISTRY}/siga-asignaturas" >> $GITHUB_ENV
          echo "MS_GRADE_ECR=${REGISTRY}/siga-notas" >> $GITHUB_ENV
          echo "BFF_WEB_ECR=${REGISTRY}/siga-bff-web" >> $GITHUB_ENV
          echo "FRONTEND_ECR=${REGISTRY}/siga-frontend" >> $GITHUB_ENV
          echo "MS_DOCENTES_ECR=${REGISTRY}/siga-docentes" >> $GITHUB_ENV
          echo "MS_APODERADOS_ECR=${REGISTRY}/siga-apoderados" >> $GITHUB_ENV
          echo "MS_CLASES_ECR=${REGISTRY}/siga-clases" >> $GITHUB_ENV
          echo "MS_EVALUACIONES_ECR=${REGISTRY}/siga-evaluaciones" >> $GITHUB_ENV
          echo "MS_ASIS_ECR=${REGISTRY}/siga-asistencias" >> $GITHUB_ENV
          echo "MS_NOTIF_ECR=${REGISTRY}/siga-notificaciones" >> $GITHUB_ENV
          echo "MS_RABBIT_ADMIN_ECR=${REGISTRY}/siga-rabbitmq-admin" >> $GITHUB_ENV

      # Descubre el destino en AWS por tag/nombre: evita mantener EC2_HOST y
      # API_GW_INVOKE_URL como secrets (cambian al recrear la infraestructura).
      - name: Resolver destino (EC2 + API Gateway)
        run: |
          EC2_HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=SIGA-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          API_GW_INVOKE_URL=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='SIGA-http-api'].ApiEndpoint | [0]" --output text)

          if [ -z "$EC2_HOST" ] || [ "$EC2_HOST" = "None" ]; then
            echo "No se encontro la instancia SIGA-app en ejecucion. Corre 'terraform apply' primero." >&2
            exit 1
          fi
          if [ -z "$API_GW_INVOKE_URL" ] || [ "$API_GW_INVOKE_URL" = "None" ]; then
            echo "No se encontro el API Gateway SIGA-http-api. Corre 'terraform apply' primero." >&2
            exit 1
          fi

          echo "EC2_HOST=${EC2_HOST}" >> $GITHUB_ENV
          echo "API_GW_INVOKE_URL=${API_GW_INVOKE_URL}" >> $GITHUB_ENV
          echo "Destino resuelto -> EC2=${EC2_HOST} API=${API_GW_INVOKE_URL}"

      # El contexto de build es apps/backend (el pom padre y los modulos son
      # necesarios); por eso se usa -f con el Dockerfile de cada servicio.
      - name: Build & Push - ms-usuarios-auth
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_USER_ECR:${TAG_VERSION} -t $MS_USER_ECR:latest \
            -f ./apps/backend/ms-usuarios-auth/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-estudiantes
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_EST_ECR:${TAG_VERSION} -t $MS_EST_ECR:latest \
            -f ./apps/backend/ms-estudiantes/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-asignaturas
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_ASIGN_ECR:${TAG_VERSION} -t $MS_ASIGN_ECR:latest \
            -f ./apps/backend/ms-asignaturas/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-notas
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_GRADE_ECR:${TAG_VERSION} -t $MS_GRADE_ECR:latest \
            -f ./apps/backend/ms-notas/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-docentes
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_DOCENTES_ECR:${TAG_VERSION} -t $MS_DOCENTES_ECR:latest \
            -f ./apps/backend/ms-docentes/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-apoderados
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_APODERADOS_ECR:${TAG_VERSION} -t $MS_APODERADOS_ECR:latest \
            -f ./apps/backend/ms-apoderados/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-clases
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_CLASES_ECR:${TAG_VERSION} -t $MS_CLASES_ECR:latest \
            -f ./apps/backend/ms-clases/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-evaluaciones
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_EVALUACIONES_ECR:${TAG_VERSION} -t $MS_EVALUACIONES_ECR:latest \
            -f ./apps/backend/ms-evaluaciones/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-asistencias
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_ASIS_ECR:${TAG_VERSION} -t $MS_ASIS_ECR:latest \
            -f ./apps/backend/ms-asistencias/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-notificaciones
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_NOTIF_ECR:${TAG_VERSION} -t $MS_NOTIF_ECR:latest \
            -f ./apps/backend/ms-notificaciones/Dockerfile ./apps/backend --push

      - name: Build & Push - ms-rabbitmq-admin
        run: |
          docker buildx build --platform linux/amd64 \
            -t $MS_RABBIT_ADMIN_ECR:${TAG_VERSION} -t $MS_RABBIT_ADMIN_ECR:latest \
            -f ./apps/backend/ms-rabbitmq-admin/Dockerfile ./apps/backend --push

      - name: Build & Push - bff-web
        run: |
          docker buildx build --platform linux/amd64 \
            -t $BFF_WEB_ECR:${TAG_VERSION} -t $BFF_WEB_ECR:latest \
            -f ./apps/backend/bff-web/Dockerfile ./apps/backend --push

      - name: Build & Push - frontend
        run: |
          docker buildx build --platform linux/amd64 \
            -t $FRONTEND_ECR:${TAG_VERSION} -t $FRONTEND_ECR:latest \
            ./apps/frontend --push

      # La EC2 recibe el compose desde el repo en cada deploy: el de user-data
      # solo se escribe al crear la instancia y quedaria desactualizado.
      - name: Copiar docker-compose a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/terraform/templates/docker-compose.yml"
          target: "/home/ubuntu/siga/"
          strip_components: 3
          overwrite: true

      # Configuración del clúster RabbitMQ (peer discovery classic_config).
      - name: Copiar configuracion del cluster RabbitMQ a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/rabbitmq/rabbitmq-cluster.conf"
          target: "/home/ubuntu/siga/"
          strip_components: 2
          overwrite: true

      - name: Deploy en la EC2 (stack completo)
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ env.TAG_VERSION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_APP_ID_URI: ${{ secrets.AZURE_APP_ID_URI }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_API_APP_ID: ${{ secrets.AZURE_API_APP_ID }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
          REGISTRO_ASYNC_ENABLED: ${{ secrets.REGISTRO_ASYNC_ENABLED }}
          REGISTRO_CRED_KEY: ${{ secrets.REGISTRO_CRED_KEY }}
          REGISTRO_NOTIFY_CREDENTIALS_ENABLED: ${{ secrets.REGISTRO_NOTIFY_CREDENTIALS_ENABLED }}
          API_GW_INVOKE_URL: ${{ env.API_GW_INVOKE_URL }}
          EC2_HOST: ${{ env.EC2_HOST }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,IMAGE_TAG,AWS_REGION,DB_USER,DB_PASS,MARIADB_ROOT_PASSWORD,AZURE_TENANT_ID,AZURE_CLIENT_ID,AZURE_APP_ID_URI,AZURE_CLIENT_SECRET,AZURE_API_APP_ID,RABBITMQ_USER,RABBITMQ_PASSWORD,RABBITMQ_ERLANG_COOKIE,REGISTRO_ASYNC_ENABLED,REGISTRO_CRED_KEY,REGISTRO_NOTIFY_CREDENTIALS_ENABLED,API_GW_INVOKE_URL,EC2_HOST
          script: |
            set -e
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
            cd /home/ubuntu/siga

            # Panel de RabbitMQ: Caddy genera HTTPS automatico (sslip.io + Let's
            # Encrypt) y publica el Management UI, que exige su propio login del
            # broker. Sin basic auth extra: dos capas HTTP Basic en el mismo
            # origen comparten el header Authorization y provocan un bucle de
            # credenciales en el navegador.
            PANEL_HOST="${EC2_HOST//./-}.sslip.io"
            cat > /home/ubuntu/siga/Caddyfile <<CADDY
            $PANEL_HOST {
                reverse_proxy rabbitmq1:15672
            }
            CADDY

            # Respaldo diario: dump de las 10 bases + definiciones de RabbitMQ en
            # el EBS, con rotacion de 7 dias (cron del usuario ubuntu, 06:15 UTC).
            cat > /home/ubuntu/siga/backup-bd.sh <<'BACKUP'
            #!/bin/bash
            set -euo pipefail
            cd /home/ubuntu/siga
            DBU=$(grep -E '^DB_USER=' .env | cut -d= -f2-)
            DBP=$(grep -E '^DB_PASS=' .env | cut -d= -f2-)
            FECHA=$(date +%F)
            DEST=/home/ubuntu/siga-data/backups/diario/$FECHA
            mkdir -p "$DEST"
            for DB in siga_usuarios_db siga_estudiantes_db siga_asignaturas_db siga_notas_db siga_docentes_db siga_apoderados_db siga_clases_db siga_evaluaciones_db siga_asistencias_db siga_notificaciones_db; do
              docker exec siga-mariadb mariadb-dump -u"$DBU" -p"$DBP" --single-transaction --skip-lock-tables --routines "$DB" > "$DEST/$DB.sql" 2>/dev/null
            done
            docker exec rabbitmq1 rabbitmqctl export_definitions /tmp/siga-definiciones.json >/dev/null 2>&1 || true
            docker cp rabbitmq1:/tmp/siga-definiciones.json "$DEST/rabbitmq-definiciones.json" >/dev/null 2>&1 || true
            find /home/ubuntu/siga-data/backups/diario -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
            echo "respaldo completado: $DEST"
            BACKUP
            chmod +x /home/ubuntu/siga/backup-bd.sh
            mkdir -p /home/ubuntu/siga-data/backups
            crontab -l 2>/dev/null | grep -vF 'backup-bd.sh' > /tmp/siga-crontab.txt || true
            echo '15 6 * * * /home/ubuntu/siga/backup-bd.sh >> /home/ubuntu/siga-data/backups/cron.log 2>&1' >> /tmp/siga-crontab.txt
            crontab /tmp/siga-crontab.txt
            rm -f /tmp/siga-crontab.txt
            crontab -l | grep 'backup-bd.sh'

            cat > .env <<EOF
            REGISTRY=$REGISTRY
            IMAGE_TAG=$IMAGE_TAG
            DB_USER=$DB_USER
            DB_PASS=$DB_PASS
            MARIADB_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD
            AZURE_TENANT_ID=$AZURE_TENANT_ID
            AZURE_CLIENT_ID=$AZURE_CLIENT_ID
            AZURE_APP_ID_URI=$AZURE_APP_ID_URI
            AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET
            AZURE_API_APP_ID=$AZURE_API_APP_ID
            RABBITMQ_USER=$RABBITMQ_USER
            RABBITMQ_PASS=$RABBITMQ_PASSWORD
            RABBITMQ_ERLANG_COOKIE=$RABBITMQ_ERLANG_COOKIE
            REGISTRO_ASYNC_ENABLED=$REGISTRO_ASYNC_ENABLED
            REGISTRO_CRED_KEY=$REGISTRO_CRED_KEY
            REGISTRO_NOTIFY_CREDENTIALS_ENABLED=$REGISTRO_NOTIFY_CREDENTIALS_ENABLED
            EOF

            cat > config.json <<EOF
            {
              "bffBaseUrl": "$API_GW_INVOKE_URL/api",
              "useMocks": false,
              "msal": {
                "clientId": "$AZURE_CLIENT_ID",
                "authority": "https://login.microsoftonline.com/$AZURE_TENANT_ID",
                "redirectUri": "/auth",
                "postLogoutRedirectUri": "/sin-acceso",
                "scopes": [
                  "$AZURE_APP_ID_URI/Acceso.Base",
                  "$AZURE_APP_ID_URI/usuarios:read",
                  "$AZURE_APP_ID_URI/usuarios:write",
                  "$AZURE_APP_ID_URI/usuarios:update",
                  "$AZURE_APP_ID_URI/usuarios:delete",
                  "$AZURE_APP_ID_URI/estudiantes:read",
                  "$AZURE_APP_ID_URI/estudiantes:write",
                  "$AZURE_APP_ID_URI/estudiantes:update",
                  "$AZURE_APP_ID_URI/estudiantes:delete",
                  "$AZURE_APP_ID_URI/asignaturas:read",
                  "$AZURE_APP_ID_URI/asignaturas:write",
                  "$AZURE_APP_ID_URI/asignaturas:update",
                  "$AZURE_APP_ID_URI/asignaturas:delete",
                  "$AZURE_APP_ID_URI/notas:read",
                  "$AZURE_APP_ID_URI/notas:write",
                  "$AZURE_APP_ID_URI/notas:update",
                  "$AZURE_APP_ID_URI/notas:delete",
                  "$AZURE_APP_ID_URI/docentes:read",
                  "$AZURE_APP_ID_URI/docentes:write",
                  "$AZURE_APP_ID_URI/docentes:update",
                  "$AZURE_APP_ID_URI/docentes:delete",
                  "$AZURE_APP_ID_URI/apoderados:read",
                  "$AZURE_APP_ID_URI/apoderados:write",
                  "$AZURE_APP_ID_URI/apoderados:update",
                  "$AZURE_APP_ID_URI/apoderados:delete",
                  "$AZURE_APP_ID_URI/clases:read",
                  "$AZURE_APP_ID_URI/clases:write",
                  "$AZURE_APP_ID_URI/clases:update",
                  "$AZURE_APP_ID_URI/clases:delete",
                  "$AZURE_APP_ID_URI/evaluaciones:read",
                  "$AZURE_APP_ID_URI/evaluaciones:write",
                  "$AZURE_APP_ID_URI/evaluaciones:update",
                  "$AZURE_APP_ID_URI/evaluaciones:delete",
                  "$AZURE_APP_ID_URI/horarios:write",
                  "$AZURE_APP_ID_URI/horarios:update",
                  "$AZURE_APP_ID_URI/horarios:delete",
                  "$AZURE_APP_ID_URI/inscripciones:read",
                  "$AZURE_APP_ID_URI/inscripciones:write",
                  "$AZURE_APP_ID_URI/inscripciones:update",
                  "$AZURE_APP_ID_URI/asistencias:read",
                  "$AZURE_APP_ID_URI/asistencias:write",
                  "$AZURE_APP_ID_URI/asistencias:update",
                  "$AZURE_APP_ID_URI/asistencias:delete"
                ]
              }
            }
            EOF

            # user-data solo corre al crear la instancia; en instancias existentes
            # hay que preparar los directorios de los dos nodos RabbitMQ (uid 999)
            # en el EBS. La cookie Erlang se escribe ANTES del primer arranque de
            # los nodos: si falta, RabbitMQ genera una aleatoria y el CLI queda
            # desalineado (Invalid challenge reply / colas atoradas).
            mkdir -p /home/ubuntu/siga-data/rabbitmq1 /home/ubuntu/siga-data/rabbitmq2
            # sudo: el archivo del volumen pertenece al uid 999 (rabbitmq).
            printf '%s' "$RABBITMQ_ERLANG_COOKIE" | sudo tee /home/ubuntu/siga-data/rabbitmq1/.erlang.cookie > /dev/null
            printf '%s' "$RABBITMQ_ERLANG_COOKIE" | sudo tee /home/ubuntu/siga-data/rabbitmq2/.erlang.cookie > /dev/null
            sudo chown -R 999:999 /home/ubuntu/siga-data/rabbitmq1 /home/ubuntu/siga-data/rabbitmq2
            sudo chmod 600 /home/ubuntu/siga-data/rabbitmq1/.erlang.cookie /home/ubuntu/siga-data/rabbitmq2/.erlang.cookie

            # init-db.sh solo corre con el directorio de datos vacio: en volumenes
            # existentes hay que crear las bases y otorgar los permisos de forma
            # idempotente. Se cubren las 10 bases (no solo las nuevas) porque un
            # volumen antiguo puede no tener grants de estudiantes/notas/usuarios.
            docker compose --env-file .env up -d mariadb rabbitmq1 rabbitmq2
            docker compose --env-file .env exec -T mariadb mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" <<SQL
            CREATE DATABASE IF NOT EXISTS siga_usuarios_db     CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_estudiantes_db  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_notas_db        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_docentes_db     CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_apoderados_db   CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_clases_db       CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_evaluaciones_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_asistencias_db  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_notificaciones_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS siga_asignaturas_db  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER IF NOT EXISTS '$DB_USER'@'%' IDENTIFIED BY '$DB_PASS';
            GRANT ALL PRIVILEGES ON siga_usuarios_db.*     TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_estudiantes_db.*  TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_notas_db.*        TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_docentes_db.*     TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_apoderados_db.*   TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_clases_db.*       TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_evaluaciones_db.* TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_asistencias_db.*  TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_notificaciones_db.* TO '$DB_USER'@'%';
            GRANT ALL PRIVILEGES ON siga_asignaturas_db.*  TO '$DB_USER'@'%';
            FLUSH PRIVILEGES;
            SQL

            # ms-asignaturas cambio su esquema: si la base quedo con el modelo viejo
            # (sin tipo_asignatura) se recrea una sola vez para que Flyway aplique
            # V1/V2. MariaDB no admite varios statements en un mismo PREPARE: el
            # DROP y el CREATE se preparan por separado.
            docker compose --env-file .env exec -T mariadb mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" -e "
              SET @viejo := (SELECT COUNT(*) FROM information_schema.COLUMNS
                WHERE TABLE_SCHEMA='siga_asignaturas_db' AND TABLE_NAME='asignaturas' AND COLUMN_NAME='tipo_asignatura');
              SET @borrar := IF(@viejo = 0, 'DROP DATABASE IF EXISTS siga_asignaturas_db', 'SELECT 1');
              PREPARE sd FROM @borrar; EXECUTE sd; DEALLOCATE PREPARE sd;
              SET @crear := IF(@viejo = 0, 'CREATE DATABASE siga_asignaturas_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci', 'SELECT 1');
              PREPARE sc FROM @crear; EXECUTE sc; DEALLOCATE PREPARE sc;
              GRANT ALL PRIVILEGES ON siga_asignaturas_db.* TO '$DB_USER'@'%'; FLUSH PRIVILEGES;"

            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            # El Caddyfile se monta como archivo: si su contenido cambia, compose
            # no recrea el contenedor. Se reinicia Caddy para aplicar la config.
            docker compose --env-file .env restart caddy > /dev/null
            # Las imagenes con tag fijo se acumulan en cada deploy: se eliminan
            # las no usadas de mas de 24 h para no llenar el disco raiz (20 GB).
            docker image prune -a -f --filter "until=24h" > /dev/null
            docker image prune -f > /dev/null
