# Configuracion de GitGuardian.
# Los tests de migraciones usan un password efimero de Testcontainers (contenedor
# local que se crea y destruye en el test); no es un secreto real.
version: 2
secret:
  ignored-paths:
    - "apps/backend/**/src/test/**/MigracionesTest.java"
  ignored-matches:
    - name: password efimero de Testcontainers
      match: ^siga$
    - name: texto fijo de prueba de cifrado en historial
      match: '^Secreta-123!$'
    - name: fallback MariaDB root historico de Compose local
      match: '^RAHHH234$'
    - name: fallback MariaDB user historico de Compose local
      match: '^fakta2$'
